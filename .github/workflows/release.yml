name: Release

# On main, a version of Cargo.toml without its tag v<version> yet is
# released: tests, Rollercoaster.app in a .dmg (macOS ARM) and an archive of
# the binaries (Linux x64), then the tag and the GitHub release with those
# files and docs/RELEASE-NOTES.md. To release: raise `version` in
# Cargo.toml, update the notes, merge into main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: New version?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$version already released"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "releasing v$version"
          fi

  macos:
    name: macOS ARM (.dmg)
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - id: bundle
        run: echo "file=$(tools/macos/bundle.sh | tail -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ${{ steps.bundle.outputs.file }}

  linux:
    name: Linux x64 (.tar.gz)
    needs: version
    if: needs.version.outputs.new == 'true'
    # an older Ubuntu: its glibc suits more distributions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - id: package
        run: echo "file=$(tools/linux/package.sh | tail -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ${{ steps.package.outputs.file }}

  publish:
    name: Tag and release
    needs: [version, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Rollercoaster ${{ needs.version.outputs.version }}
          body_path: docs/RELEASE-NOTES.md
          files: dist/*
