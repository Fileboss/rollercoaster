name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux x64 (the Ubuntu of the releases) and macOS ARM, the two
        # targets of Rollercoaster
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      # samples/ (Looping's outputs, students' models) is not published:
      # the tests comparing with Looping are skipped, the others run,
      # including the no-panic campaign (tests/campaign.rs)
      - name: Tests
        run: cargo test --workspace
      # the deliverables of this commit, downloadable from the run's page
      # (releases: release.yml)
      - name: Deliverable
        id: deliverable
        run: |
          if [ "$RUNNER_OS" = macOS ]; then f=$(tools/macos/bundle.sh | tail -1); else f=$(tools/linux/package.sh | tail -1); fi
          echo "file=$f" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: rollercoaster-${{ runner.os }}
          path: ${{ steps.deliverable.outputs.file }}
          retention-days: 14
